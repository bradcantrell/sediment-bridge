<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sediment — Mara</title>
  <script>p5.disableFriendlyErrors = true;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden;
      background: #0a0a14; cursor: crosshair;
    }
    canvas { display: block; }

    #hud {
      position: fixed; top: 16px; left: 16px;
      font-family: 'Courier New', monospace;
      font-size: 12px; color: rgba(255,255,255,0.55);
      pointer-events: none; line-height: 1.8;
      user-select: none; z-index: 10;
    }
    #hud .val { color: rgba(255,200,100,0.8); }
    #hud .warn { color: rgba(255,120,80,0.8); }

    #bake-btn {
      position: fixed; top: 16px; right: 16px;
      font-family: 'Courier New', monospace;
      font-size: 13px; color: #fa0; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,200,100,0.3);
      padding: 8px 18px; cursor: pointer; z-index: 20;
      transition: all 0.2s;
    }
    #bake-btn:hover { background: rgba(255,200,100,0.15); border-color: #fa0; }
    #bake-btn.baking { color: rgba(255,255,255,0.4); border-color: rgba(255,255,255,0.15); pointer-events: none; }

    #bake-result {
      position: fixed; bottom: 50px; right: 16px;
      font-family: 'Courier New', monospace; font-size: 11px;
      color: rgba(255,255,255,0.5); text-align: right;
      z-index: 20; pointer-events: none; line-height: 1.6;
      max-width: 280px;
    }
    #bake-result .of-val { color: rgba(100,200,255,0.8); }

    #help {
      position: fixed; bottom: 16px; left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      font-size: 11px; color: rgba(255,255,255,0.35);
      pointer-events: none; user-select: none;
      z-index: 10; text-align: center;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <div id="hud">
    sim-time: <span class="val" id="simtime">0.0</span>s<br>
    mobile: <span class="val" id="mobile">3000</span>
    deposited: <span class="val" id="deposited">0</span><br>
    obstacles: <span class="val" id="obstacles">0</span><br>
    shape: <span class="val" id="shape">square</span>
    &phi;: <span class="val" id="rot">0</span>&deg;<br>
    <span class="warn" id="paused"></span>
  </div>
  <div id="help">1/2 shape &middot; wheel rotate &middot; click place &middot; drag move &middot; backspace delete &middot; F flow &middot; G grid &middot; H help &middot; M bed &middot; space pause &middot; S save &middot; <span style="color:#fa0">B bake</span></div>
  <button id="bake-btn" onclick="bakeToOpenFOAM()">⚙ BAKE</button>
  <div id="bake-result"></div>

<script>
// ─────────────────────────────────────────────
// CONFIGURATION
// ─────────────────────────────────────────────
const NX = 160;
const NY = 90;
const SIZE = (NX + 2) * (NY + 2);
const IX = (i, j) => i + j * (NX + 2);

const DT = 0.08;
const VISC = 0.00005;
const INFLOW = 2.5;
const N_PARTICLES = 3000;
const SETTLE_THRESH = 0.20;
const EROSION_THRESH = 0.50;
const SETTLE_PROB = 0.012;
const EROSION_PROB = 0.06;
const MIN_PARTICLE_AGE = 0.8; // Seconds before particle can settle
const MIN_TRAVEL_X = 100;    // px — absolute no-settlement injection zone
const GAUSS_SEIDEL_ITERS = 30;

// ─────────────────────────────────────────────
// GLOBAL STATE
// ─────────────────────────────────────────────
let u, v, uPrev, vPrev;
let solid;
let p, divArr;

let obstacles = [];
let selectedIdx = -1;

let ghostType = 'square';
let ghostRotation = 0;
let ghostSize = 40;

let particles = [];
let deposited = [];

let depoBuffer;
let gridLayer;

let paused = false;
let showFlow = false;
let showGrid = false;
let showHelp = true;
let simTime = 0;

// Bed profile
let bedMode = false;
let bedPoints = [];  // [{x, z}] in pixel coords, z=0 at bottom, positive upward
let bedXSections = [];  // [{x, points: [{y, z}]}] — cross-section profiles at each station
let activeXSection = -1;  // Index of cross-section being edited, or -1

function bedZ(x) {
  // Return bed elevation z at pixel x (interpolated from bedPoints)
  // Returns 0 if no profile defined
  if (bedPoints.length < 2) return 0;
  if (x <= bedPoints[0].x) return bedPoints[0].z;
  if (x >= bedPoints[bedPoints.length - 1].x) return bedPoints[bedPoints.length - 1].z;
  for (let k = 0; k < bedPoints.length - 1; k++) {
    if (bedPoints[k].x <= x && x <= bedPoints[k + 1].x) {
      let t = (x - bedPoints[k].x) / (bedPoints[k + 1].x - bedPoints[k].x);
      return bedPoints[k].z + t * (bedPoints[k + 1].z - bedPoints[k].z);
    }
  }
  return 0;
}

let cellW, cellH;
let dragging = false;
let dragOffX, dragOffY;

// ─────────────────────────────────────────────
// FLUID SOLVER (Jos Stam, adapted with obstacles)
// ─────────────────────────────────────────────

function addSource(x, s) {
  for (let j = 1; j <= NY; j++) {
    for (let i = 1; i <= NX; i++) {
      let idx = IX(i, j);
      if (solid[idx]) continue;
      x[idx] += DT * s[idx];
    }
  }
}

function buildSolidMask() {
  solid.fill(0);
  for (let ob of obstacles) {
    if (simTime < ob.appearsAt || simTime > ob.disappearsAt) continue;
    // Convert obstacle pixel coords to grid coords
    let cx = ob.x / cellW;
    let cy = ob.y / cellH;
    let r = ob.size / 2;
    let rg = r / ((cellW + cellH) / 2); // radius in grid cells

    // Bounding box in grid coords
    let i0 = max(1, floor(cx - rg - 1));
    let i1 = min(NX, ceil(cx + rg + 1));
    let j0 = max(1, floor(cy - rg - 1));
    let j1 = min(NY, ceil(cy + rg + 1));

    for (let j = j0; j <= j1; j++) {
      for (let i = i0; i <= i1; i++) {
        let idx = IX(i, j);
        if (solid[idx]) continue;

        let px = i - cx;
        let py = j - cy;

        if (ob.type === 'circle') {
          if (px * px + py * py <= rg * rg) {
            solid[idx] = 1;
          }
        } else {
          // Rotated square
          let cosA = cos(-ob.rotation * PI / 180);
          let sinA = sin(-ob.rotation * PI / 180);
          let rx = px * cosA - py * sinA;
          let ry = px * sinA + py * cosA;
          if (abs(rx) <= rg && abs(ry) <= rg) {
            solid[idx] = 1;
          }
        }
      }
    }
  }
}

function setBnd(b, x) {
  // Left boundary: no-slip for u (b=1), zero-gradient for others
  for (let j = 1; j <= NY; j++) {
    x[IX(0, j)] = b === 1 ? -x[IX(1, j)] : x[IX(1, j)];
  }
  // Right boundary: outflow (zero-gradient for all fields)
  for (let j = 1; j <= NY; j++) {
    x[IX(NX+1, j)] = x[IX(NX, j)];
  }
  // Top and bottom: free-slip (u: zero-gradient, v: no-through, p: zero-gradient)
  for (let i = 1; i <= NX; i++) {
    x[IX(i, 0)]    = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
    x[IX(i, NY+1)] = b === 2 ? -x[IX(i, NY)] : x[IX(i, NY)];
  }
  // Corner averages
  x[IX(0, 0)]         = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
  x[IX(0, NY+1)]      = 0.5 * (x[IX(1, NY+1)] + x[IX(0, NY)]);
  x[IX(NX+1, 0)]      = 0.5 * (x[IX(NX, 0)] + x[IX(NX+1, 1)]);
  x[IX(NX+1, NY+1)]   = 0.5 * (x[IX(NX, NY+1)] + x[IX(NX+1, NY)]);
}

function linSolve(b, x, x0, a, c) {
  for (let iter = 0; iter < GAUSS_SEIDEL_ITERS; iter++) {
    for (let j = 1; j <= NY; j++) {
      for (let i = 1; i <= NX; i++) {
        let idx = IX(i, j);
        if (solid[idx]) continue;
        let left   = solid[IX(i-1, j)]   ? x[idx] : x[IX(i-1, j)];
        let right  = solid[IX(i+1, j)]   ? x[idx] : x[IX(i+1, j)];
        let bottom = solid[IX(i, j-1)]   ? x[idx] : x[IX(i, j-1)];
        let top    = solid[IX(i, j+1)]   ? x[idx] : x[IX(i, j+1)];
        x[idx] = (x0[idx] + a * (left + right + bottom + top)) / c;
      }
    }
    setBnd(b, x);
  }
}

function diffuse(b, x, x0, diff) {
  let a = DT * diff * NX * NY;
  linSolve(b, x, x0, a, 1 + 4 * a);
}

function advect(b, d, d0, uVec, vVec) {
  let dt0 = DT * NX;
  for (let j = 1; j <= NY; j++) {
    for (let i = 1; i <= NX; i++) {
      let idx = IX(i, j);
      if (solid[idx]) { d[idx] = 0; continue; }

      let x = i - dt0 * uVec[idx];
      let y = j - dt0 * vVec[idx];

      // Clamp to grid
      x = constrain(x, 0.5, NX + 0.5);
      y = constrain(y, 0.5, NY + 0.5);

      let i0 = floor(x), i1 = i0 + 1;
      let j0 = floor(y), j1 = j0 + 1;

      // If backtrace lands in solid, fall back to current cell
      if (solid[IX(i0, j0)] || solid[IX(i1, j0)] || solid[IX(i0, j1)] || solid[IX(i1, j1)]) {
        d[idx] = d0[idx];
        continue;
      }

      let sx = x - i0;
      let sy = y - j0;
      d[idx] = (1 - sx) * (1 - sy) * d0[IX(i0, j0)]
             + sx       * (1 - sy) * d0[IX(i1, j0)]
             + (1 - sx) * sy       * d0[IX(i0, j1)]
             + sx       * sy       * d0[IX(i1, j1)];
    }
  }
  setBnd(b, d);
}

function project(uVec, vVec, pArr, divArr) {
  // Compute divergence
  for (let j = 1; j <= NY; j++) {
    for (let i = 1; i <= NX; i++) {
      let idx = IX(i, j);
      if (solid[idx]) { divArr[idx] = 0; pArr[idx] = 0; continue; }
      let uR = solid[IX(i+1, j)] ? 0 : uVec[IX(i+1, j)];
      let uL = solid[IX(i-1, j)] ? 0 : uVec[idx];
      let vT = solid[IX(i, j+1)] ? 0 : vVec[IX(i, j+1)];
      let vB = solid[IX(i, j-1)] ? 0 : vVec[idx];
      divArr[idx] = -0.5 * (uR - uL + vT - vB);
      pArr[idx] = 0;
    }
  }
  setBnd(0, divArr);
  setBnd(0, pArr);

  // Solve pressure (Neumann BC: b=0)
  linSolve(0, pArr, divArr, 1, 4);

  // Subtract pressure gradient
  for (let j = 1; j <= NY; j++) {
    for (let i = 1; i <= NX; i++) {
      let idx = IX(i, j);
      if (solid[idx]) { uVec[idx] = 0; vVec[idx] = 0; continue; }
      let pR = solid[IX(i+1, j)] ? pArr[idx] : pArr[IX(i+1, j)];
      let pL = solid[IX(i-1, j)] ? pArr[idx] : pArr[IX(i-1, j)];
      let pT = solid[IX(i, j+1)] ? pArr[idx] : pArr[IX(i, j+1)];
      let pB = solid[IX(i, j-1)] ? pArr[idx] : pArr[IX(i, j-1)];
      uVec[idx] -= 0.5 * (pR - pL);
      vVec[idx] -= 0.5 * (pT - pB);
    }
  }
  setBnd(1, uVec);
  setBnd(2, vVec);
}

function velocityStep() {
  // Use uPrev/vPrev as scratch for source + diffusion
  uPrev.fill(0);
  vPrev.fill(0);

  // Swap and diffuse
  [u, uPrev] = [uPrev, u];
  diffuse(1, u, uPrev, VISC);
  [v, vPrev] = [vPrev, v];
  diffuse(2, v, vPrev, VISC);

  project(u, v, uPrev, vPrev);

  [u, uPrev] = [uPrev, u];
  [v, vPrev] = [vPrev, v];
  advect(1, u, uPrev, uPrev, vPrev);
  advect(2, v, vPrev, uPrev, vPrev);

  project(u, v, uPrev, vPrev);

  // ── Dirichlet inflow BC: clamp left edge u to INFLOW ──
  for (let j = 1; j <= NY; j++) {
    let idx = IX(1, j);
    if (!solid[idx]) {
      let noiseVal = (noise(j * 0.15, simTime * 0.3) - 0.5) * 0.3;
      u[idx] = INFLOW + noiseVal;
    }
  }

  // Zero out solid cells (belt and suspenders)
  for (let i = 0; i < SIZE; i++) {
    if (solid[i]) { u[i] = 0; v[i] = 0; }
  }
}

// ─────────────────────────────────────────────
// OBSTACLE MANAGEMENT
// ─────────────────────────────────────────────

function addObstacle(x, y, type, rotation) {
  obstacles.push({
    type: type,
    x: x,
    y: y,
    size: ghostSize,
    rotation: rotation || 0,
    appearsAt: simTime,
    disappearsAt: Infinity
  });
  selectedIdx = obstacles.length - 1;
}

function deleteObstacle(idx) {
  if (idx >= 0 && idx < obstacles.length) {
    obstacles.splice(idx, 1);
    if (selectedIdx >= obstacles.length) selectedIdx = obstacles.length - 1;
    if (obstacles.length === 0) selectedIdx = -1;
  }
}

function hitTestObstacle(mx, my) {
  for (let i = obstacles.length - 1; i >= 0; i--) {
    let ob = obstacles[i];
    if (simTime < ob.appearsAt || simTime > ob.disappearsAt) continue;
    let dx = mx - ob.x, dy = my - ob.y;

    if (ob.type === 'circle') {
      if (dx * dx + dy * dy <= (ob.size / 2) * (ob.size / 2)) return i;
    } else {
      let cosA = cos(-ob.rotation * PI / 180);
      let sinA = sin(-ob.rotation * PI / 180);
      let rx = dx * cosA - dy * sinA;
      let ry = dx * sinA + dy * cosA;
      let half = ob.size / 2;
      if (abs(rx) <= half && abs(ry) <= half) return i;
    }
  }
  return -1;
}

// ─────────────────────────────────────────────
// SEDIMENT PARTICLES
// ─────────────────────────────────────────────

function getVelocityAt(px, py) {
  // Bilinear interpolation of velocity field at pixel coordinates
  let gx = px / cellW;
  let gy = py / cellH;
  gx = constrain(gx, 1.0, NX);  // Keep inside interior domain
  gy = constrain(gy, 1.0, NY);

  let i0 = floor(gx), i1 = i0 + 1;
  let j0 = floor(gy), j1 = j0 + 1;
  let sx = gx - i0, sy = gy - j0;

  // Clamp indices to interior to avoid boundary cells
  i0 = constrain(i0, 1, NX); i1 = constrain(i1, 1, NX);
  j0 = constrain(j0, 1, NY); j1 = constrain(j1, 1, NY);

  let idx00 = IX(i0, j0), idx10 = IX(i1, j0);
  let idx01 = IX(i0, j1), idx11 = IX(i1, j1);

  if (solid[idx00] || solid[idx10] || solid[idx01] || solid[idx11]) {
    return { vx: 0, vy: 0 };
  }

  let vx = (1 - sx) * (1 - sy) * u[idx00] + sx * (1 - sy) * u[idx10]
         + (1 - sx) * sy * u[idx01] + sx * sy * u[idx11];
  let vy = (1 - sx) * (1 - sy) * v[idx00] + sx * (1 - sy) * v[idx10]
         + (1 - sx) * sy * v[idx01] + sx * sy * v[idx11];

  return { vx: vx * cellW, vy: vy * cellH };
}

function isInsideObstacle(px, py) {
  return hitTestObstacle(px, py) >= 0;
}

function spawnParticle() {
  return {
    x: random(cellW, cellW * 3),  // Spawn inside first few cells
    y: random(cellH, height - cellH),
    vx: random(INFLOW * 0.5, INFLOW * 1.2) * cellW,
    vy: random(-0.3, 0.3) * cellH,
    born: simTime
  };
}

function initParticles() {
  particles = [];
  deposited = [];
  for (let i = 0; i < N_PARTICLES; i++) {
    particles.push(spawnParticle());
  }
}

function updateParticles() {
  // Mobile particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    let vel = getVelocityAt(p.x, p.y);
    p.vx = vel.vx;
    p.vy = vel.vy;

    // ── Bed influence (plan view: affects flow depth, no collision) ──
    if (bedPoints.length >= 2) {
      let bz = bedZ(p.x);  // Bed elevation at this x (z-scale, not canvas y)
      let bedMaxZ = 160;
      // Mass conservation: higher bed → shallower flow → faster velocity
      // Reference depth is bedMaxZ (flat = max depth)
      let effectiveDepth = bedMaxZ - bz;
      if (effectiveDepth > 5 && bedMaxZ > 0) {
        let scale = bedMaxZ / effectiveDepth;
        p.vx *= scale;
        p.vy *= scale;
      }
    }

    // Advect
    p.x += p.vx * DT * 4;
    p.y += p.vy * DT * 4;

    // Random jitter (sub-grid diffusion)
    p.x += (noise(p.x * 0.01, p.y * 0.01, simTime) - 0.5) * 2;
    p.y += (noise(p.x * 0.01 + 100, p.y * 0.01, simTime) - 0.5) * 2;

    // ── Edges are a viewport: particles exit → die ──
    if (p.x < 0 || p.x > width || p.y < 0 || p.y > height) {
      particles.splice(i, 1);
      continue;
    }

    // Inside obstacle? Bounce out
    if (isInsideObstacle(p.x, p.y)) {
      p.x += random(-5, 5);
      p.y += random(-5, 5);
    }

    let speed = mag(p.vx, p.vy) / ((cellW + cellH) / 2);

    // Settle — only if particle has existed long enough AND cleared the injection zone
    let age = simTime - (p.born || 0);
    if (p.x > MIN_TRAVEL_X && age > MIN_PARTICLE_AGE && speed < SETTLE_THRESH && random() < SETTLE_PROB) {
      deposited.push({ x: p.x, y: p.y });
      particles.splice(i, 1);
    }
  }

  // Deposited particles: check for erosion
  for (let i = deposited.length - 1; i >= 0; i--) {
    let d = deposited[i];
    let vel = getVelocityAt(d.x, d.y);
    let speed = mag(vel.vx, vel.vy) / ((cellW + cellH) / 2);

    if (speed > EROSION_THRESH && random() < EROSION_PROB) {
      // Erode: draw dark spot, reactivate
      depoBuffer.noStroke();
      depoBuffer.fill(10, 10, 20, 80);
      depoBuffer.ellipse(d.x, d.y, 8, 8);
      particles.push({
        x: d.x + random(-3, 3),
        y: d.y + random(-3, 3),
        vx: vel.vx + random(-0.5, 0.5),
        vy: vel.vy + random(-0.5, 0.5),
        born: simTime  // Reset age on re-entrainment
      });
      deposited.splice(i, 1);
    }
  }

  // Respawn missing particles at inflow
  while (particles.length + deposited.length < N_PARTICLES) {
    particles.push({
      x: random(cellW, cellW * 3),
      y: random(cellH, height - cellH),
      vx: random(INFLOW * 0.5, INFLOW * 1.5) * cellW,
      vy: random(-0.2, 0.2) * cellH,
      born: simTime
    });
  }
}

// ─────────────────────────────────────────────
// VISUAL RENDERING
// ─────────────────────────────────────────────

function drawDeposition() {
  // Draw new deposits
  for (let d of deposited) {
    depoBuffer.noStroke();
    // Fresh deposit: warm amber glow
    let alpha = 18;
    depoBuffer.fill(255, 180, 60, alpha);
    depoBuffer.ellipse(d.x, d.y, 6, 6);
    // Brighter center
    depoBuffer.fill(255, 210, 100, alpha * 0.6);
    depoBuffer.ellipse(d.x, d.y, 3, 3);
  }
}

function drawFlowField() {
  if (!showFlow) return;
  stroke(0, 200, 255, 90);
  strokeWeight(0.8);
  let step = max(1, floor(min(NX, NY) / 30));
  for (let j = step; j <= NY; j += step) {
    for (let i = step; i <= NX; i += step) {
      let idx = IX(i, j);
      if (solid[idx]) continue;
      let px = i * cellW;
      let py = j * cellH;
      let vx = u[idx] * cellW * 3;
      let vy = v[idx] * cellH * 3;
      let spd = mag(u[idx], v[idx]);
      if (spd < 0.001) continue;
      let len = constrain(spd * 8, 4, 30);
      let nx = vx / spd;
      let ny = vy / spd;
      line(px, py, px + nx * len, py + ny * len);
      // Arrowhead
      let ax = px + nx * len;
      let ay = py + ny * len;
      let tip = 3;
      line(ax, ay, ax - nx * tip - ny * tip * 0.5, ay - ny * tip + nx * tip * 0.5);
      line(ax, ay, ax - nx * tip + ny * tip * 0.5, ay - ny * tip - nx * tip * 0.5);
    }
  }
}

function drawGrid() {
  if (!showGrid) return;
  stroke(30, 30, 60, 40);
  strokeWeight(0.5);
  for (let i = 0; i <= NX; i++) {
    let x = i * cellW;
    line(x, 0, x, height);
  }
  for (let j = 0; j <= NY; j++) {
    let y = j * cellH;
    line(0, y, width, y);
  }
}

function drawObstacles() {
  for (let i = 0; i < obstacles.length; i++) {
    let ob = obstacles[i];
    if (simTime < ob.appearsAt || simTime > ob.disappearsAt) continue;

    push();
    translate(ob.x, ob.y);
    rotate(ob.rotation * PI / 180);

    // Body
    noFill();
    if (i === selectedIdx) {
      stroke(255, 255, 255, 220);
      strokeWeight(2.5);
    } else {
      stroke(255, 255, 255, 140);
      strokeWeight(1.5);
    }

    let half = ob.size / 2;
    if (ob.type === 'circle') {
      ellipse(0, 0, ob.size);
    } else {
      rectMode(CENTER);
      rect(0, 0, ob.size, ob.size);
    }

    // Selection glow
    if (i === selectedIdx) {
      stroke(255, 200, 100, 80);
      strokeWeight(4);
      if (ob.type === 'circle') {
        ellipse(0, 0, ob.size + 6);
      } else {
        rect(0, 0, ob.size + 6, ob.size + 6);
      }
    }

    // Thin center cross
    stroke(255, 255, 255, 60);
    strokeWeight(0.5);
    line(-8, 0, 8, 0);
    line(0, -8, 0, 8);

    pop();
  }
}

function drawGhost() {
  if (dragging || mouseX < 0 || mouseX > width || mouseY < 0 || mouseY > height) return;

  let overObstacle = hitTestObstacle(mouseX, mouseY) >= 0;

  push();
  translate(mouseX, mouseY);
  rotate(ghostRotation * PI / 180);

  drawingContext.setLineDash([4, 4]);
  noFill();
  stroke(overObstacle ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.25)');
  strokeWeight(1.2);

  let half = ghostSize / 2;
  if (ghostType === 'circle') {
    ellipse(0, 0, ghostSize);
  } else {
    rectMode(CENTER);
    rect(0, 0, ghostSize, ghostSize);
  }
  drawingContext.setLineDash([]);

  // Rotation indicator
  stroke(255, 255, 255, 50);
  strokeWeight(0.8);
  line(0, 0, half + 8, 0);

  pop();
}

function drawParticles() {
  // Mobile particles
  noStroke();
  fill(255, 170, 60, 200);
  for (let p of particles) {
    ellipse(p.x, p.y, 3, 3);
  }
}

function drawBedProfile() {
  if (bedPoints.length < 2 && !bedMode) return;
  
  let stripH = 160;  // Height of the section design strip
  let stripY = height - stripH;
  
  // ── Design strip background ──
  noStroke();
  fill(10, 12, 22, 200);
  rect(0, stripY, width, stripH);
  
  // Grid lines
  let bedMaxZ = 160;
  stroke(40, 40, 55, 60);
  strokeWeight(0.5);
  for (let gz = 20; gz < bedMaxZ; gz += 20) {
    let gy = stripY + stripH - (gz / bedMaxZ) * stripH;
    line(0, gy, width, gy);
    // Label
    noStroke();
    fill(255, 255, 255, 30);
    textAlign(RIGHT, CENTER);
    textSize(9);
    text(gz, 22, gy);
  }
  
  // Strip border
  stroke(60, 60, 80, 100);
  strokeWeight(1);
  line(0, stripY, width, stripY);
  
  // Label
  noStroke();
  fill(255, 255, 255, 50);
  textAlign(LEFT, TOP);
  textSize(10);
  text('bed profile (z↑)', 8, stripY + 4);
  
  // ── Draw profile curve in the strip ──
  // Map z values (0 to bedH) to strip y (stripY+stripH = bottom, stripY = top)
  bedMaxZ = 160;  // Max display height in px (matches stripH)
  if (bedPoints.length >= 2) {
    // Fill below profile in strip
    fill(30, 28, 45, 120);
    noStroke();
    beginShape();
    for (let pt of bedPoints) {
      let sy = stripY + stripH - (pt.z / bedMaxZ) * stripH;
      vertex(pt.x, sy);
    }
    vertex(bedPoints[bedPoints.length - 1].x, stripY + stripH);
    vertex(bedPoints[0].x, stripY + stripH);
    endShape(CLOSE);
    
    // Profile line in strip
    stroke(255, 180, 60, 200);
    strokeWeight(2);
    noFill();
    beginShape();
    for (let pt of bedPoints) {
      let sy = stripY + stripH - (pt.z / bedMaxZ) * stripH;
      vertex(pt.x, sy);
    }
    endShape();
    
    // Control points in strip
    for (let pt of bedPoints) {
      let sy = stripY + stripH - (pt.z / bedMaxZ) * stripH;
      fill(255, 180, 60, 200);
      noStroke();
      ellipse(pt.x, sy, 6, 6);
    }
    
    // ── Draw contour lines on the main canvas (plan view) ──
    // Contours represent z(x) extruded across all y
    stroke(255, 180, 60, 30);
    strokeWeight(1);
    for (let zLevel = 20; zLevel <= bedMaxZ; zLevel += 20) {
      beginShape();
      for (let pt of bedPoints) {
        if (pt.z >= zLevel) {
          vertex(pt.x, 0);
        } else {
          // Find where profile crosses this z-level
          endShape();
          beginShape();
        }
      }
      endShape();
    }
  }
  
  // ── Bed mode indicator in strip ──
  if (bedMode && mouseX >= 0 && mouseX <= width && mouseY >= stripY) {
    // Snap to strip for drawing
    let mz = (stripY + stripH - mouseY) / stripH * bedMaxZ;
    mz = max(0, min(bedMaxZ * 2, mz));
    noStroke();
    fill(255, 200, 100, 150);
    ellipse(mouseX, stripY + stripH - (mz / bedMaxZ) * stripH, 8, 8);
    
    if (bedPoints.length > 0) {
      let last = bedPoints[bedPoints.length - 1];
      let lastSY = stripY + stripH - (last.z / bedMaxZ) * stripH;
      stroke(255, 200, 100, 60);
      strokeWeight(1);
      line(last.x, lastSY, mouseX, stripY + stripH - (mz / bedMaxZ) * stripH);
    }
  }

  // ── Cross-section strips ──
  let xStripW = 60;  // Width of each vertical cross-section strip (doubled)
  for (let si = 0; si < bedPoints.length; si++) {
    let pt = bedPoints[si];
    let baseZ = pt.z;  // Anchor z from longitudinal section
    let sx = pt.x - xStripW / 2;
    
    // Strip background
    noStroke();
    fill(si === activeXSection ? 'rgba(40,35,55,0.85)' : 'rgba(25,22,40,0.7)');
    rect(sx, 0, xStripW, stripY);
    
    // Light grid lines (vertical, at elevation intervals)
    stroke(40, 40, 55, 40);
    strokeWeight(0.5);
    for (let gz = 20; gz <= bedMaxZ; gz += 20) {
      // Map elevation to horizontal position: right edge = z=0 (deepest), left = z=bedMaxZ (highest)
      let gx = sx + xStripW - (gz / bedMaxZ) * xStripW;
      line(gx, 0, gx, stripY);
    }
    
    // Strip border
    stroke(si === activeXSection ? 'rgba(255,180,60,0.5)' : 'rgba(60,60,80,0.3)');
    strokeWeight(1);
    noFill();
    rect(sx, 0, xStripW, stripY);
    
    // Label at top
    noStroke();
    fill(255, 255, 255, 40);
    textAlign(CENTER, TOP);
    textSize(8);
    text('x' + Math.round(pt.x), pt.x, 2);
    
    // Elevation labels at bottom
    textAlign(RIGHT, BOTTOM);
    textSize(7);
    fill(255, 255, 255, 25);
    text('hi', sx + 2, stripY - 2);
    textAlign(LEFT, BOTTOM);
    text('lo', sx + xStripW - 12, stripY - 2);
    
    // Find or create cross-section data
    let xsData = bedXSections.find(xs => xs.x === pt.x);
    
    // Draw existing profile if present
    if (xsData && xsData.points.length >= 2) {
      // Sort by y (cross-channel position)
      let pts = [...xsData.points].sort((a, b) => a.y - b.y);
      
      // Profile line: y→vertical position, z→horizontal position (right=low)
      stroke(255, 180, 60, 180);
      strokeWeight(2);
      noFill();
      beginShape();
      for (let p of pts) {
        // y maps to vertical position in strip (bottom of canvas = bottom of strip)
        let vy = p.y / height * stripY;
        // z maps to horizontal: right edge = z=0 (deep), left edge = z=bedMaxZ (high)
        // The drawn z is relative to baseZ, so actual elevation = baseZ + p.z
        let absZ = baseZ + p.z;
        let vx = sx + xStripW - (absZ / bedMaxZ) * xStripW;
        vx = constrain(vx, sx, sx + xStripW);
        vertex(vx, vy);
      }
      endShape();
      
      // Control points
      for (let p of pts) {
        let vy = p.y / height * stripY;
        let absZ = baseZ + p.z;
        let vx = sx + xStripW - (absZ / bedMaxZ) * xStripW;
        vx = constrain(vx, sx, sx + xStripW);
        fill(255, 180, 60, 200);
        noStroke();
        ellipse(vx, vy, 5, 5);
      }
    }
    
    // Reference line (base z from bottom strip)
    let refX = sx + xStripW - (baseZ / bedMaxZ) * xStripW;
    stroke(255, 255, 255, 25);
    strokeWeight(0.5);
    line(refX, 0, refX, stripY);
    
    // Active indicator
    if (si === activeXSection) {
      noFill();
      stroke(255, 200, 100, 80);
      strokeWeight(1.5);
      rect(sx - 1, 0, xStripW + 2, stripY);
    }
  }
}

function updateHUD() {
  let fmt = (n) => n.toFixed(1);
  document.getElementById('simtime').textContent = fmt(simTime);
  document.getElementById('mobile').textContent = particles.length;
  document.getElementById('deposited').textContent = deposited.length;
  document.getElementById('obstacles').textContent = obstacles.length;
  document.getElementById('shape').textContent = ghostType;
  document.getElementById('rot').textContent = fmt(ghostRotation % 360);
  document.getElementById('paused').textContent = paused ? '⏸ PAUSED' : '';
  if (bedMode) {
    document.getElementById('paused').textContent = '🖉 BED MODE (' + bedPoints.length + ' pts)';
  }

  let help = document.getElementById('help');
  help.style.opacity = showHelp ? '1' : '0';
}

// ─────────────────────────────────────────────
// P5.JS LIFECYCLE
// ─────────────────────────────────────────────

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);

  cellW = width / NX;
  cellH = height / NY;

  // Allocate fluid arrays
  u     = new Float32Array(SIZE);
  v     = new Float32Array(SIZE);
  uPrev = new Float32Array(SIZE);
  vPrev = new Float32Array(SIZE);
  solid = new Uint8Array(SIZE);
  p     = new Float32Array(SIZE);
  divArr = new Float32Array(SIZE);

  // Deposition buffer
  depoBuffer = createGraphics(width, height);
  depoBuffer.background(0, 0);

  // Seed obstacles for an interesting starting scene
  addObstacle(width * 0.2, height * 0.35, 'circle', 0);
  addObstacle(width * 0.35, height * 0.6, 'square', 30);
  addObstacle(width * 0.55, height * 0.4, 'square', -15);
  ghostRotation = 30;

  // ── Spin up the flow before spawning particles ──
  // Without this, particles spawn in dead water and settle instantly
  for (let k = 0; k < 80; k++) {
    simTime += DT;
    buildSolidMask();
    velocityStep();
  }

  initParticles();
}

function draw() {
  if (!paused) {
    simTime += DT;

    // Build solid mask from current obstacles
    buildSolidMask();

    // Fluid step
    velocityStep();

    // Particles
    updateParticles();

    // Draw deposition this frame
    drawDeposition();
  }

  // ── COMPOSITE ──
  // Background
  background(10, 10, 20);

  // Grid
  drawGrid();

  // Bed profile (below deposition so deposits accumulate on bed surface)
  drawBedProfile();

  // Deposition buffer
  image(depoBuffer, 0, 0);

  // Flow field vectors
  drawFlowField();

  // Mobile particles
  drawParticles();

  // Obstacles
  drawObstacles();

  // Ghost preview
  if (!paused && !bedMode) drawGhost();

  // HUD
  updateHUD();
  
  // Update comparison panel if visible
  if (showComparison) drawComparison();
}

// ─────────────────────────────────────────────
// INTERACTION
// ─────────────────────────────────────────────

function mousePressed() {
  if (mouseX < 0 || mouseX > width || mouseY < 0 || mouseY > height) return;

  if (bedMode) {
    let stripH = 160;
    let stripY = height - stripH;
    let bedMaxZ = 160;
    
    // Click in design strip → modify longitudinal section
    if (mouseY >= stripY) {
      let z = (stripY + stripH - mouseY) / stripH * bedMaxZ;
      bedPoints.push({ x: mouseX, z: max(0, z) });
      bedPoints.sort((a, b) => a.x - b.x);
      return;
    }
    
    // Click on main canvas → select nearest vertical strip
    // Find the closest profile point
    let closestIdx = -1;
    let closestDist = Infinity;
    for (let i = 0; i < bedPoints.length; i++) {
      let d = abs(mouseX - bedPoints[i].x);
      if (d < 40 && d < closestDist) {  // Within 40px of a station
        closestDist = d;
        closestIdx = i;
      }
    }
    
    if (closestIdx >= 0) {
      activeXSection = closestIdx;
      let pt = bedPoints[closestIdx];
      let xStripW = 60;
      let sx = pt.x - xStripW / 2;
      if (mouseX >= sx && mouseX <= sx + xStripW && mouseY < stripY) {
        // Click within the vertical strip: add profile point
        // y position in canvas → cross-channel position (bottom of canvas = bottom of strip)
        let y = mouseY / stripY * height;
        // x position in strip → elevation: right edge = z=0, left edge = bedMaxZ
        let relX = (mouseX - sx) / xStripW;  // 0=left(hi), 1=right(lo)
        let absZ = (1 - relX) * bedMaxZ;  // Map back to absolute z
        let z = absZ - pt.z;  // Relative to base z
        z = max(0, z);
        
        let xsIdx = bedXSections.findIndex(xs => xs.x === pt.x);
        if (xsIdx < 0) {
          bedXSections.push({ x: pt.x, points: [] });
          xsIdx = bedXSections.length - 1;
        }
        bedXSections[xsIdx].points.push({ y: constrain(y, 0, height), z: z });
        bedXSections[xsIdx].points.sort((a, b) => a.y - b.y);
      }
    } else {
      activeXSection = -1;
    }
    return;
  }

  let hit = hitTestObstacle(mouseX, mouseY);

  if (hit >= 0) {
    // Select existing obstacle
    selectedIdx = hit;
    ghostRotation = obstacles[hit].rotation;
    ghostType = obstacles[hit].type;
    dragging = true;
    dragOffX = obstacles[hit].x - mouseX;
    dragOffY = obstacles[hit].y - mouseY;
  } else {
    // Place new obstacle
    addObstacle(mouseX, mouseY, ghostType, ghostRotation);
  }
}

function mouseDragged() {
  if (dragging && selectedIdx >= 0) {
    obstacles[selectedIdx].x = mouseX + dragOffX;
    obstacles[selectedIdx].y = mouseY + dragOffY;
  }
}

function mouseReleased() {
  dragging = false;
}

function mouseWheel(event) {
  let delta = event.delta > 0 ? 5 : -5;
  ghostRotation = (ghostRotation + delta) % 360;
  if (ghostRotation < 0) ghostRotation += 360;

  if (selectedIdx >= 0) {
    obstacles[selectedIdx].rotation = ghostRotation;
  }
  return false;
}

function keyPressed() {
  if (key === ' ') {
    paused = !paused;
  } else if (key === 'f' || key === 'F') {
    showFlow = !showFlow;
  } else if (key === 'g' || key === 'G') {
    showGrid = !showGrid;
  } else if (key === 'h' || key === 'H') {
    showHelp = !showHelp;
  } else if (key === '1') {
    ghostType = 'circle';
  } else if (key === '2') {
    ghostType = 'square';
  } else if (key === '3') {
    ghostSize = max(20, ghostSize - 5);
  } else if (key === '4') {
    ghostSize = min(100, ghostSize + 5);
  } else if ((key === 'Backspace' || key === 'Delete') && selectedIdx >= 0) {
    deleteObstacle(selectedIdx);
    selectedIdx = -1;
  } else if (key === 'Backspace' || key === 'Delete') {
    // In bed mode, remove last point
    if (bedMode && bedPoints.length > 0) {
      bedPoints.pop();
    }
  } else if (key === 'Escape') {
    selectedIdx = -1;
    dragging = false;
    if (bedMode) bedMode = false;
  } else if (key === 'm' || key === 'M') {
    bedMode = !bedMode;
    if (bedMode) {
      paused = true;  // Pause sim while drawing bed
    }
  } else if (key === 's' || key === 'S') {
    saveCanvas('sediment-' + floor(simTime), 'png');
  } else if (key === 'b' || key === 'B') {
    bakeToOpenFOAM();
  } else if (key === 'r' || key === 'R') {
    // Reset
    depoBuffer.clear();
    deposited = [];
    initParticles();
    simTime = 0;
  }
  return false;
}

// ─────────────────────────────────────────────
// OPENFOAM BRIDGE
// ─────────────────────────────────────────────

const BRIDGE_URL = 'http://localhost:8090';
let baking = false;
let comparisonData = null;
let showComparison = false;

function renderComparison(ofGrid) {
  comparisonData = ofGrid;
  showComparison = true;
  drawComparison();
}

function drawComparison() {
  if (!showComparison || !comparisonData) return;
  
  const nx = NX, ny = NY;
  const ofMag = comparisonData.mag;
  const ofMax = comparisonData.mag_max;
  
  // Build Stam velocity magnitude from u[], v[]
  const stamMag = [];
  let stamMax = 0;
  for (let j = 1; j <= NY; j++) {
    for (let i = 1; i <= NX; i++) {
      const idx = IX(i, j);
      const spd = Math.sqrt(u[idx]*u[idx] + v[idx]*v[idx]);
      stamMag.push(spd);
      if (spd > stamMax) stamMax = spd;
    }
  }
  
  // Shared color scale: use Stam max for consistency
  const scaleMax = Math.max(stamMax, ofMax * 0.6); // Scale OF down since it's in m/s
  
  // Create overlay canvas
  let overlay = document.getElementById('comparison-canvas');
  if (!overlay) {
    overlay = document.createElement('canvas');
    overlay.id = 'comparison-canvas';
    overlay.style.cssText = 'position:fixed;bottom:0;left:0;z-index:15;border-top:1px solid rgba(255,255,255,0.1);';
    document.body.appendChild(overlay);
  }
  
  const cw = Math.min(window.innerWidth, 1280);
  const ch = 200;
  overlay.width = cw;
  overlay.height = ch;
  overlay.style.width = cw + 'px';
  overlay.style.height = ch + 'px';
  
  const ctx = overlay.getContext('2d');
  const halfW = Math.floor(cw / 2);
  const cellW_c = halfW / nx;
  const cellH_c = ch / ny;
  
  function velColor(t) {
    t = Math.max(0, Math.min(1, Math.pow(t, 0.55)));
    let r, g, b;
    if (t < 0.25) { r=0; g=t*4; b=1; }
    else if (t < 0.5) { r=0; g=1; b=1-(t-0.25)*4; }
    else if (t < 0.75) { r=(t-0.5)*4; g=1; b=0; }
    else { r=1; g=1-(t-0.75)*4; b=0; }
    return `rgb(${Math.floor(r*255)},${Math.floor(g*255)},${Math.floor(b*255)})`;
  }
  
  // Left: Stam
  for (let j = 0; j < ny; j++) {
    for (let i = 0; i < nx; i++) {
      const t = stamMag[j * nx + i] / scaleMax;
      ctx.fillStyle = velColor(t);
      ctx.fillRect(i * cellW_c, j * cellH_c, cellW_c + 0.5, cellH_c + 0.5);
    }
  }
  
  // Right: OpenFOAM
  for (let j = 0; j < ny; j++) {
    for (let i = 0; i < nx; i++) {
      const ofIdx = j * nx + i;
      const t = (ofMag[ofIdx] || 0) / (scaleMax * 1.67); // Scale to Stam units
      ctx.fillStyle = velColor(t);
      ctx.fillRect(halfW + i * cellW_c, j * cellH_c, cellW_c + 0.5, cellH_c + 0.5);
    }
  }
  
  // Divider
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(halfW, 0);
  ctx.lineTo(halfW, ch);
  ctx.stroke();
  
  // Labels
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '11px monospace';
  ctx.fillText('← Stam (live)', 8, 14);
  ctx.fillText('OpenFOAM (baked) →', halfW + 8, 14);
  ctx.fillText(stamMax.toFixed(1) + ' g.u.', 8, ch - 6);
  ctx.fillText(ofMax.toFixed(1) + ' m/s', halfW + 8, ch - 6);
}

async function bakeToOpenFOAM() {
  if (baking) return;
  baking = true;
  
  const btn = document.getElementById('bake-btn');
  const result = document.getElementById('bake-result');
  btn.textContent = '⟳ BAKING...';
  btn.className = 'baking';
  result.innerHTML = 'sending state...';
  
  // Collect state
  const state = {
    obstacles: obstacles.map(ob => ({
      type: ob.type,
      x: ob.x,
      y: ob.y,
      size: ob.size,
      rotation: ob.rotation
    })),
    inflow: INFLOW,
    width: width,
    height: height,
    depo_png: depoBuffer.elt.toDataURL('image/png'),  // Bed morphology
    bed_profile: bedPoints  // User-drawn bed cross-section
  };
  
  try {
    // POST state to bridge
    const resp = await fetch(BRIDGE_URL + '/bake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state)
    });
    const data = await resp.json();
    
    if (data.error) {
      result.innerHTML = '<span style="color:#f66">error: ' + data.error + '</span>';
      baking = false;
      btn.textContent = '⚙ BAKE';
      btn.className = '';
      return;
    }
    
    // Poll until complete
    let done = false;
    while (!done) {
      await new Promise(r => setTimeout(r, 500));
      const statusResp = await fetch(BRIDGE_URL + '/status');
      const status = await statusResp.json();
      
      result.innerHTML = status.status + ' <span style="color:#888">' + status.progress + '%</span>';
      
      if (status.status === 'complete') {
        done = true;
        const r = status.result;
        if (r) {
          const pctRev = (r.reverse_cells / r.n_cells * 100).toFixed(1);
          result.innerHTML = 
            'OF cells: <span class="of-val">' + r.n_cells + '</span><br>' +
            'U<sub>x</sub>: <span class="of-val">' + r.ux_min.toFixed(2) + '</span> … <span class="of-val">' + r.ux_max.toFixed(2) + '</span> m/s<br>' +
            'mean: <span class="of-val">' + r.ux_mean.toFixed(2) + '</span> m/s<br>' +
            'reverse: <span class="of-val">' + r.reverse_cells + ' cells (' + pctRev + '%)</span>';
          // Render side-by-side comparison
          if (r.grid) renderComparison(r.grid);
        }
      } else if (status.status === 'failed') {
        done = true;
        result.innerHTML = '<span style="color:#f66">failed: ' + (status.error || 'unknown') + '</span>';
      }
    }
  } catch (e) {
    result.innerHTML = '<span style="color:#f66">connection failed<br>is bridge server running?</span>';
  }
  
  baking = false;
  btn.textContent = '⚙ BAKE';
  btn.className = '';
}

function windowResized() {
  // Resize canvas, preserve simulation state
  let oldDepo = depoBuffer;
  resizeCanvas(windowWidth, windowHeight);
  cellW = width / NX;
  cellH = height / NY;

  // Resize deposition buffer
  depoBuffer = createGraphics(width, height);
  if (oldDepo) {
    depoBuffer.image(oldDepo, 0, 0, width, height);
    oldDepo.remove();
  }
}
